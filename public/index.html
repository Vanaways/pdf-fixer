<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Fixer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">
  <div class="bg-white shadow-xl rounded-2xl p-6 sm:p-8 md:p-10 w-full max-w-md sm:max-w-lg">
    <div class="flex items-center justify-center mb-4">
      <svg class="h-8 w-8 text-blue-600 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800">PDF Fixer</h1>
    </div>
    <p class="text-sm text-gray-500 text-center mb-6">Upload a PDF to convert it for Document Builder</p>

    <form id="pdfForm" class="space-y-4">
      <div id="dropZone"
        class="border-2 border-dashed border-gray-300 rounded-xl p-6 sm:p-8 text-center cursor-pointer transition-colors hover:border-blue-400 hover:bg-blue-50">
        <svg class="mx-auto h-10 w-10 text-gray-400 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
        </svg>
        <p class="text-sm text-gray-600 mb-1">Drag &amp; drop a PDF here, or <span class="text-blue-600 font-medium">browse</span></p>
        <p class="text-xs text-gray-400">PDF files only</p>
        <input id="fileInput" type="file" name="pdf" accept="application/pdf" class="hidden" />
      </div>

      <div id="fileInfo" class="hidden flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-4 py-3">
        <div class="flex items-center min-w-0">
          <svg class="h-5 w-5 text-blue-500 mr-2 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          <span id="fileName" class="text-sm text-blue-700 font-medium truncate"></span>
        </div>
        <button type="button" id="removeFile" class="text-blue-400 hover:text-blue-600 ml-2 flex-shrink-0">
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <button id="submitBtn" type="submit" disabled
        class="w-full bg-blue-600 text-white py-2.5 sm:py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors text-sm sm:text-base">
        Convert PDF
      </button>
    </form>

    <div id="loading" class="hidden mt-6">
      <div class="flex items-center justify-center">
        <svg class="animate-spin h-5 w-5 text-blue-600 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span class="text-blue-600 text-sm">Converting PDF… Please wait</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-1.5 mt-3">
        <div class="bg-blue-600 h-1.5 rounded-full animate-pulse" style="width: 100%"></div>
      </div>
    </div>

    <div id="successMsg" class="hidden mt-6 flex items-center justify-center bg-green-50 border border-green-200 rounded-lg px-4 py-3">
      <svg class="h-5 w-5 text-green-500 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      <span class="text-green-700 text-sm font-medium">PDF converted and downloaded successfully!</span>
    </div>

    <div id="errorMsg" class="hidden mt-6 flex items-center justify-center bg-red-50 border border-red-200 rounded-lg px-4 py-3">
      <svg class="h-5 w-5 text-red-500 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
      <span class="text-red-700 text-sm font-medium">Error converting PDF. Please try again.</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('pdfForm');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const removeFile = document.getElementById('removeFile');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');

    // Click to browse
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-blue-400', 'bg-blue-50');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-blue-400', 'bg-blue-50');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-400', 'bg-blue-50');
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') {
        fileInput.files = e.dataTransfer.files;
        showFile(file.name);
      }
    });

    // File selected
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        showFile(fileInput.files[0].name);
      }
    });

    function showFile(name) {
      fileName.textContent = name;
      fileInfo.classList.remove('hidden');
      dropZone.classList.add('hidden');
      submitBtn.disabled = false;
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');
    }

    // Remove file
    removeFile.addEventListener('click', () => {
      fileInput.value = '';
      fileInfo.classList.add('hidden');
      dropZone.classList.remove('hidden');
      submitBtn.disabled = true;
    });

    // Submit via fetch to trigger download with original name
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      loading.classList.remove('hidden');
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('pdf', fileInput.files[0]);

      try {
        const response = await fetch('/convert', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('Conversion failed');

        const disposition = response.headers.get('Content-Disposition');
        let downloadName = fileInput.files[0].name;
        if (disposition) {
          const match = disposition.match(/filename="?(.+?)"?$/);
          if (match) downloadName = match[1];
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        loading.classList.add('hidden');
        successMsg.classList.remove('hidden');
      } catch {
        loading.classList.add('hidden');
        errorMsg.classList.remove('hidden');
      }

      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
